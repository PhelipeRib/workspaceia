<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Virtual Workspace - Interactive Atlas Map</title>
  <!-- Tailwind CSS CDN para renderização rápida da UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilização para Pixel Art e Canvas Interativo */
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 select-none">

  <!-- Header / Barra Superior -->
  <header class="w-full bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl p-3 flex justify-between items-center z-10">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg font-bold tracking-wide text-slate-100">Gather Office Workspace</h1>
      <span class="bg-slate-700 text-xs px-2 py-0.5 rounded text-slate-300 font-mono">v2.4 Atlas Edition</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-toggle-grid" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded transition font-medium">Grid: ON</button>
      <button id="btn-recenter" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded transition font-medium">Centralizar</button>
    </div>
  </header>

  <!-- Container Principal: Canvas do Jogo + Sidebars -->
  <main class="flex-1 my-3 flex gap-4 overflow-hidden relative">
    
    <!-- Painel Lateral Esquerdo: Agentes & Status -->
    <aside class="w-64 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl p-4 flex flex-col gap-3 custom-scrollbar overflow-y-auto">
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Agentes em Sala</h2>
      <div id="agent-list" class="flex flex-col gap-2">
        <div class="flex items-center gap-3 p-2 bg-slate-700/50 rounded-lg border border-slate-600/50">
          <div class="w-8 h-8 bg-indigo-500/20 border border-indigo-400/30 rounded flex items-center justify-center font-bold text-indigo-400">P1</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-200 truncate">Você (Player)</p>
            <p class="text-xs text-emerald-400">Ativo • Estação A1</p>
          </div>
        </div>
        <div class="flex items-center gap-3 p-2 bg-slate-700/30 rounded-lg border border-slate-700">
          <div class="w-8 h-8 bg-amber-500/20 border border-amber-400/30 rounded flex items-center justify-center font-bold text-amber-400">A1</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-300 truncate">Dev Bot QA</p>
            <p class="text-xs text-slate-400">Ausente • Reunião</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Canvas Central do Mapa -->
    <section class="flex-1 relative flex items-center justify-center">
      <canvas id="workspace-canvas" width="960" height="640" class="shadow-2xl"></canvas>
      
      <!-- Overlay de Controles Básicos (Dicas de Movimento) -->
      <div class="absolute bottom-4 left-4 bg-slate-900/90 border border-slate-700 text-xs text-slate-300 p-2.5 rounded-lg backdrop-blur pointer-events-none">
        <p class="font-semibold text-slate-200 mb-1">Controles:</p>
        <p><span class="bg-slate-700 px-1 rounded">W</span> <span class="bg-slate-700 px-1 rounded">A</span> <span class="bg-slate-700 px-1 rounded">S</span> <span class="bg-slate-700 px-1 rounded">D</span> ou <span class="bg-slate-700 px-1 rounded">Setas</span> para mover</p>
      </div>
    </section>

    <!-- Painel Lateral Direito: Chat / Detalhes de Interação -->
    <aside id="chat-panel" class="w-80 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
      <div>
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Chat da Estação</h2>
        <div id="chat-messages" class="h-80 overflow-y-auto custom-scrollbar flex flex-col gap-2 text-xs pr-1">
          <div class="bg-slate-700/40 p-2 rounded border border-slate-600/30">
            <span class="font-bold text-indigo-400">Sistema:</span>
            <span class="text-slate-300">Carregados componentes do Atlas & Sprites. Use o mapa interativo.</span>
          </div>
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <input type="text" id="chat-input" placeholder="Enviar mensagem..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-200" />
        <button id="btn-send" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg transition font-medium">OK</button>
      </div>
    </aside>

  </main>

  <!-- Lógica do Canvas, Spritesheet e Renderização do Mapa -->
  <script>
    const canvas = document.getElementById('workspace-canvas');
    const ctx = canvas.getContext('2d');

    // Configuração de Renderização Pixel Art
    const TILE_SIZE = 32;
    const COLS = 30;
    const ROWS = 20;
    let showGrid = true;

    // Posição do Jogador
    const player = {
      x: 5,
      y: 5,
      pixelX: 5 * TILE_SIZE,
      pixelY: 5 * TILE_SIZE,
      speed: 4,
      size: TILE_SIZE,
      color: '#6366f1'
    };

    // Imagem do Atlas / Spritesheet (Carregamento da imagem tratada do Zip/JPEG)
    const atlasImage = new Image();
    let atlasLoaded = false;
    atlasImage.src = 'gather_office_atlas.png'; // Atualize para o nome correto extraído do zip/jpeg
    atlasImage.onload = () => {
      atlasLoaded = true;
      draw();
    };

    // Desenha o Grid de Estações/Escritório
    function drawGrid() {
      if (!showGrid) return;
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 0.5;

      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * TILE_SIZE);
        ctx.lineTo(COLS * TILE_SIZE, r * TILE_SIZE);
        ctx.stroke();
      }
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * TILE_SIZE, 0);
        ctx.lineTo(c * TILE_SIZE, ROWS * TILE_SIZE);
        ctx.stroke();
      }
    }

    // Desenha o Jogador/Sprite
    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(
        player.pixelX + TILE_SIZE / 2,
        player.pixelY + TILE_SIZE / 2,
        TILE_SIZE / 3,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Loop Principal de Renderização
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (atlasLoaded) {
        // Se a imagem do atlas estiver presente, desenha o background renderizado
        ctx.drawImage(atlasImage, 0, 0, canvas.width, canvas.height);
      } else {
        // Fallback estilizado enquanto o atlas recarrega
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      drawGrid();
      drawPlayer();
    }

    // Movimentação do Personagem Smooth
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function update() {
      let moved = false;
      if (keys['w'] || keys['arrowup']) {
        if (player.pixelY > 0) { player.pixelY -= player.speed; moved = true; }
      }
      if (keys['s'] || keys['arrowdown']) {
        if (player.pixelY < canvas.height - TILE_SIZE) { player.pixelY += player.speed; moved = true; }
      }
      if (keys['a'] || keys['arrowleft']) {
        if (player.pixelX > 0) { player.pixelX -= player.speed; moved = true; }
      }
      if (keys['d'] || keys['arrowright']) {
        if (player.pixelX < canvas.width - TILE_SIZE) { player.pixelX += player.speed; moved = true; }
      }

      if (moved) {
        player.x = Math.floor(player.pixelX / TILE_SIZE);
        player.y = Math.floor(player.pixelY / TILE_SIZE);
        draw();
      }
      requestAnimationFrame(update);
    }

    // Handlers de UI
    document.getElementById('btn-toggle-grid').addEventListener('click', (e) => {
      showGrid = !showGrid;
      e.target.innerText = `Grid: ${showGrid ? 'ON' : 'OFF'}`;
      draw();
    });

    document.getElementById('btn-recenter').addEventListener('click', () => {
      player.pixelX = 5 * TILE_SIZE;
      player.pixelY = 5 * TILE_SIZE;
      draw();
    });

    // Inicia Loop
    draw();
    update();
  </script>
</body>
</html>

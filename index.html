<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Virtual Workspace - Gather Atlas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 select-none">

  <!-- Header -->
  <header class="w-full bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl p-3 flex justify-between items-center z-10">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg font-bold tracking-wide text-slate-100">Gather Virtual Office</h1>
      <span class="bg-slate-700 text-xs px-2 py-0.5 rounded text-slate-300 font-mono">v2.5 Full Atlas Engine</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-toggle-grid" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded transition font-medium">Grid: OFF</button>
      <button id="btn-recenter" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded transition font-medium">Resetar Posição</button>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="flex-1 my-3 flex gap-4 overflow-hidden relative">
    
    <!-- Sidebar Esquerda -->
    <aside class="w-64 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl p-4 flex flex-col gap-3 custom-scrollbar overflow-y-auto">
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Agentes em Sala</h2>
      <div id="agent-list" class="flex flex-col gap-2">
        <div class="flex items-center gap-3 p-2 bg-slate-700/50 rounded-lg border border-slate-600/50">
          <div class="w-8 h-8 bg-indigo-500/20 border border-indigo-400/30 rounded flex items-center justify-center font-bold text-indigo-400">P1</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-200 truncate">Você (Player)</p>
            <p class="text-xs text-emerald-400">Ativo • Estação QA</p>
          </div>
        </div>
        <div class="flex items-center gap-3 p-2 bg-slate-700/30 rounded-lg border border-slate-700">
          <div class="w-8 h-8 bg-amber-500/20 border border-amber-400/30 rounded flex items-center justify-center font-bold text-amber-400">A1</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-300 truncate">Dev Bot QA</p>
            <p class="text-xs text-slate-400">Ausente • Reunião</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Canvas Central -->
    <section class="flex-1 relative flex items-center justify-center">
      <canvas id="workspace-canvas" width="960" height="640" class="shadow-2xl"></canvas>
      
      <div class="absolute bottom-4 left-4 bg-slate-900/90 border border-slate-700 text-xs text-slate-300 p-2.5 rounded-lg backdrop-blur pointer-events-none">
        <p class="font-semibold text-slate-200 mb-1">Controles:</p>
        <p><span class="bg-slate-700 px-1 rounded">W</span> <span class="bg-slate-700 px-1 rounded">A</span> <span class="bg-slate-700 px-1 rounded">S</span> <span class="bg-slate-700 px-1 rounded">D</span> ou <span class="bg-slate-700 px-1 rounded">Setas</span> para mover</p>
      </div>
    </section>

    <!-- Sidebar Direita -->
    <aside id="chat-panel" class="w-80 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
      <div>
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Chat da Estação</h2>
        <div id="chat-messages" class="h-80 overflow-y-auto custom-scrollbar flex flex-col gap-2 text-xs pr-1">
          <div class="bg-slate-700/40 p-2 rounded border border-slate-600/30">
            <span class="font-bold text-indigo-400">Sistema:</span>
            <span class="text-slate-300">Carregados objetos e tiles a partir do atlas `gather_office_atlas.png`.</span>
          </div>
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <input type="text" id="chat-input" placeholder="Enviar mensagem..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-200" />
        <button id="btn-send" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg transition font-medium">OK</button>
      </div>
    </aside>

  </main>

  <script>
    const canvas = document.getElementById('workspace-canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false; // Garante Pixel Art Nítida

    const TILE_SIZE = 32;
    const COLS = 30; // 960px
    const ROWS = 20; // 640px
    let showGrid = false;

    // Estado do Jogador
    const player = {
      x: 100,
      y: 100,
      speed: 3,
      size: 32,
      // Coordenadas de corte do Sprite do Avatar no Atlas (32x48px aprox no grid de avatares)[cite: 4]
      spriteSX: 0,
      spriteSY: 0,
      spriteW: 32,
      spriteH: 48
    };

    // Imagem do Atlas
    const atlas = new Image();
    let atlasLoaded = false;
    atlas.src = 'gather_office_atlas.png';[cite: 3, 4]
    atlas.onload = () => {
      atlasLoaded = true;
      draw();
    };

    // Mapeamento de Clipes do Atlas (Coordenadas com base na imagem 1536x1024)[cite: 4]
    const SPRITES = {
      // Tiles de Chão (Região de Flores/Pisos)
      floorWood: { sx: 0, sy: 615, sw: 32, sh: 32 },
      floorTile: { sx: 135, sy: 565, sw: 32, sh: 32 },
      wallTop:   { sx: 0, sy: 765, sw: 32, sh: 32 },

      // Móveis / Objetos (Clippings baseados no manifesto)[cite: 4]
      workstation: { sx: 535, sy: 0, sw: 120, sh: 80 },    // Mesa de Trabalho
      doubleDesk:  { sx: 660, sy: 0, sw: 120, sh: 80 },    // Dual Monitors[cite: 3, 4]
      chair:       { sx: 575, sy: 100, sw: 32, sh: 40 },   // Cadeira de Escritório[cite: 3, 4]
      sofa:        { sx: 700, sy: 275, sw: 120, sh: 60 },   // Sofá Laranja[cite: 3, 4]
      plant:       { sx: 535, sy: 410, sw: 40, sh: 50 },   // Vasos de Planta[cite: 3, 4]
      arcade:      { sx: 1380, sy: 735, sw: 35, sh: 65 },  // Máquina Arcade[cite: 4]
      poolTable:   { sx: 1200, sy: 735, sw: 90, sh: 60 }   // Mesa de Sinuca[cite: 4]
    };

    // Desenha o mapa de fundo renderizando os tiles do atlas[cite: 3, 4]
    function drawMap() {
      if (!atlasLoaded) return;

      // 1. Preencher Chão com Piso
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (r === 0) {
            // Parede Superior
            ctx.drawImage(atlas, SPRITES.wallTop.sx, SPRITES.wallTop.sy, SPRITES.wallTop.sw, SPRITES.wallTop.sh, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else {
            // Piso de Madeira
            ctx.drawImage(atlas, SPRITES.floorWood.sx, SPRITES.floorWood.sy, SPRITES.floorWood.sw, SPRITES.floorWood.sh, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // 2. Renderizar Estações de Trabalho (Desks + Chairs)[cite: 3, 4]
      ctx.drawImage(atlas, SPRITES.workstation.sx, SPRITES.workstation.sy, SPRITES.workstation.sw, SPRITES.workstation.sh, 100, 100, 120, 80);
      ctx.drawImage(atlas, SPRITES.chair.sx, SPRITES.chair.sy, SPRITES.chair.sw, SPRITES.chair.sh, 144, 180, 32, 40);

      ctx.drawImage(atlas, SPRITES.doubleDesk.sx, SPRITES.doubleDesk.sy, SPRITES.doubleDesk.sw, SPRITES.doubleDesk.sh, 300, 100, 120, 80);
      ctx.drawImage(atlas, SPRITES.chair.sx, SPRITES.chair.sy, SPRITES.chair.sw, SPRITES.chair.sh, 344, 180, 32, 40);

      // 3. Renderizar Área de Lounge / Jogos[cite: 4]
      ctx.drawImage(atlas, SPRITES.sofa.sx, SPRITES.sofa.sy, SPRITES.sofa.sw, SPRITES.sofa.sh, 600, 120, 120, 60);
      ctx.drawImage(atlas, SPRITES.poolTable.sx, SPRITES.poolTable.sy, SPRITES.poolTable.sw, SPRITES.poolTable.sh, 600, 350, 100, 70);
      ctx.drawImage(atlas, SPRITES.arcade.sx, SPRITES.arcade.sy, SPRITES.arcade.sw, SPRITES.arcade.sh, 850, 100, 40, 75);

      // 4. Plantas Decorativas[cite: 3, 4]
      ctx.drawImage(atlas, SPRITES.plant.sx, SPRITES.plant.sy, SPRITES.plant.sw, SPRITES.plant.sh, 40, 60, 40, 50);
      ctx.drawImage(atlas, SPRITES.plant.sx, SPRITES.plant.sy, SPRITES.plant.sw, SPRITES.plant.sh, 500, 60, 40, 50);
    }

    // Desenha o Jogador a partir do recorte de Sprite de Personagem do Atlas[cite: 4]
    function drawPlayer() {
      if (!atlasLoaded) return;
      // Desenha a sombra do personagem
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(player.x + 16, player.y + 42, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Renderiza o Sprite do Personagem (Primeiro avatar do grid superior esquerdo do atlas)[cite: 4]
      ctx.drawImage(
        atlas,
        player.spriteSX, player.spriteSY, player.spriteW, player.spriteH, // Recorte de Origem no Atlas[cite: 4]
        player.x, player.y, 32, 48                                       // Posição e Escala no Canvas
      );
    }

    function drawGrid() {
      if (!showGrid) return;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * TILE_SIZE);
        ctx.lineTo(COLS * TILE_SIZE, r * TILE_SIZE);
        ctx.stroke();
      }
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * TILE_SIZE, 0);
        ctx.lineTo(c * TILE_SIZE, ROWS * TILE_SIZE);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMap();
      drawGrid();
      drawPlayer();
    }

    // Controles de Movimento
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function update() {
      let moved = false;
      if (keys['w'] || keys['arrowup']) {
        if (player.y > 32) { player.y -= player.speed; moved = true; }
      }
      if (keys['s'] || keys['arrowdown']) {
        if (player.y < canvas.height - 48) { player.y += player.speed; moved = true; }
      }
      if (keys['a'] || keys['arrowleft']) {
        if (player.x > 0) { player.x -= player.speed; moved = true; }
      }
      if (keys['d'] || keys['arrowright']) {
        if (player.x < canvas.width - 32) { player.x += player.speed; moved = true; }
      }

      if (moved) draw();
      requestAnimationFrame(update);
    }

    // Handlers de UI
    document.getElementById('btn-toggle-grid').addEventListener('click', (e) => {
      showGrid = !showGrid;
      e.target.innerText = `Grid: ${showGrid ? 'ON' : 'OFF'}`;
      draw();
    });

    document.getElementById('btn-recenter').addEventListener('click', () => {
      player.x = 100;
      player.y = 100;
      draw();
    });

    // Loop
    draw();
    update();
  </script>
</body>
</html>
